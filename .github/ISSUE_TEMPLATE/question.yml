name: Question / Support
description: Ask a question or get help using the workstation
title: "[QUESTION] "
labels: ["question", "support"]
body:
  - type: markdown
    attributes:
      value: |
        Have a question? We're happy to help. Please check existing issues
        and the README first.
  - type: textarea
    id: question
    attributes:
      label: Your Question
      description: What do you need help with?
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: "Windows 11, macOS 14, Ubuntu 24.04"
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Screenshots, logs, or anything else that helps
  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
